name: Runtime v2 exact-SHA release gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact current checkout
        run: python -m pip install -r requirements.txt
      - name: Run complete repository suite
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src a6 app.py tools
      - name: Start Streamlit smoke server
        run: |
          python -m streamlit run app.py \
            --server.headless true \
            --server.address 127.0.0.1 \
            --server.port 8501 \
            > "$RUNNER_TEMP/streamlit.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/streamlit.pid"
      - name: Verify Streamlit health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8501/_stcore/health | grep -q '^ok$'; then
              echo "Streamlit smoke test PASS"
              exit 0
            fi
            sleep 1
          done
          echo "Streamlit failed to become healthy"
          cat "$RUNNER_TEMP/streamlit.log"
          exit 1
      - name: Stop Streamlit smoke server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/streamlit.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/streamlit.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/streamlit.log" ]; then
            cat "$RUNNER_TEMP/streamlit.log"
          fi
      - name: Write core report
        run: >-
          python -c "import json,os,pathlib; pathlib.Path('qa-core-report.json').write_text(json.dumps({'schema_version':2,'module':'core','status':'PASS','verdict':'VALID','contract_sha':os.environ['GITHUB_SHA'],'checks':{'full_repository_pytest':True,'compileall':True,'streamlit_health':True},'issues':[]}, indent=2)+'\\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: qa-core-report
          path: qa-core-report.json

  runtime-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run Runtime v2 evidence/interpreter probe
        run: >-
          python -m tools.a7_release.runtime_live
          --report qa-runtime-report.json
          --contract-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-runtime-report
          path: qa-runtime-report.json
          if-no-files-found: ignore

  ui-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run canonical-to-Runtime-v2 UI boundary probe
        run: >-
          python -m tools.a7_release.ui_live
          --report qa-ui-report.json
          --contract-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-ui-report
          path: qa-ui-report.json
          if-no-files-found: ignore

  release-verdict:
    if: always()
    needs: [core, runtime-live, ui-live]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download component reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: qa-*-report
          path: qa-reports
          merge-multiple: true
      - name: Aggregate exact-SHA verdict
        run: >-
          python -m tools.a7_release.release_verdict
          --reports qa-reports
          --report qa-release-verdict.json
          --sha "$GITHUB_SHA"
          --core-result '${{ needs.core.result }}'
          --runtime-result '${{ needs.runtime-live.result }}'
          --ui-result '${{ needs.ui-live.result }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-release-verdict
          path: qa-release-verdict.json
          if-no-files-found: ignore
