name: A6 integration tests

on:
  push:
    branches:
      - 'agent/a6-provenance-integration'
      - 'agent/a6-viewport-smoke'
  pull_request:
    paths:
      - 'app.py'
      - 'a6/**'
      - 'src/analyzazprav/a5_ai/integration_a6.py'
      - 'src/analyzazprav/qa/a6_contract.py'
      - 'tools/a6_viewport_smoke.py'
      - 'tests/test_a6*.py'
      - 'tests/test_a5_a6*.py'
      - 'tests/test_a7_a6*.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/a6-tests.yml'

jobs:
  full-suite-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete repository suite
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src a6 tools/a6_viewport_smoke.py app.py
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Streamlit desktop + iPhone viewport smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/a6-viewport-smoke
          streamlit run app.py \
            --server.headless true \
            --server.port 8765 \
            --server.address 127.0.0.1 \
            > /tmp/a6-streamlit.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          healthy=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/_stcore/health; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" -ne 1 ]]; then
            cat /tmp/a6-streamlit.log
            exit 1
          fi

          if ! python tools/a6_viewport_smoke.py \
            --url http://127.0.0.1:8765 \
            --output artifacts/a6-viewport-smoke; then
            cat /tmp/a6-streamlit.log
            exit 1
          fi
      - name: Upload A6 viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-viewport-smoke
          path: artifacts/a6-viewport-smoke
          if-no-files-found: warn
          retention-days: 30
