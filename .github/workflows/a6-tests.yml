name: A6 integration tests

on:
  push:
    branches:
      - 'main'
      - 'agent/a6-provenance-integration'
      - 'agent/a6-viewport-smoke'
  pull_request:
    paths:
      - 'app.py'
      - 'a6/**'
      - 'src/analyzazprav/a5_ai/integration_a6.py'
      - 'src/analyzazprav/qa/a6_contract.py'
      - 'tools/a5_live_acceptance.py'
      - 'tools/a6_viewport_smoke.py'
      - 'tools/local_app.py'
      - 'tools/real_archive_gate.py'
      - 'tests/test_a6*.py'
      - 'tests/test_a5_a6*.py'
      - 'tests/test_a7_a6*.py'
      - 'tests/test_local_app.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Makefile'
      - '.devcontainer/**'
      - '.vscode/tasks.json'
      - '.github/workflows/a6-tests.yml'

jobs:
  full-suite-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Codespaces and VS Code JSON
        run: |
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          python -m json.tool .vscode/tasks.json >/dev/null
      - name: Run repository checks
        run: make check
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium
      - name: Streamlit desktop + iPhone viewport smoke
        run: make a6-smoke
      - name: Upload A6 viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a6-viewport-smoke
          path: artifacts/a6-viewport-smoke
          if-no-files-found: warn
          retention-days: 30
