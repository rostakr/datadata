name: A0 one-shot data correctness patcher

on:
  push:
    branches:
      - agent/a0-data-correctness-hardening
    paths:
      - '.github/workflows/a0-one-shot-data-correctness.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a0-data-correctness-hardening
      - name: Apply checked data-correctness patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/analyzazprav/normalization/staging.py')
          text = path.read_text(encoding='utf-8')

          old = '''def iso_utc_to_unix_us(value: str | None) -> int | None:\n'''
          new = '''_UNIX_EPOCH_UTC = datetime(1970, 1, 1, tzinfo=timezone.utc)\n\n\ndef _datetime_to_unix_us(value: datetime) -> int:\n    delta = value.astimezone(timezone.utc) - _UNIX_EPOCH_UTC\n    return ((delta.days * 86_400 + delta.seconds) * 1_000_000) + delta.microseconds\n\n\ndef canonical_direction(is_from_me: object) -> str:\n    if is_from_me is True or is_from_me == 1:\n        return "outgoing"\n    if is_from_me is False or is_from_me == 0:\n        return "incoming"\n    return "unknown"\n\n\ndef iso_utc_to_unix_us(value: str | None) -> int | None:\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected iso helper anchor count')
          text = text.replace(old, new, 1)

          old = '''    parsed = parsed.astimezone(timezone.utc)\n    return int(parsed.timestamp() * 1_000_000)\n'''
          new = '''    return _datetime_to_unix_us(parsed)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected float timestamp anchor count')
          text = text.replace(old, new, 1)

          old = '''            is_from_me = bool(record.get("is_from_me"))\n            sender_handle = record.get("sender_handle")\n            if is_from_me:\n'''
          new = '''            direction = canonical_direction(record.get("is_from_me"))\n            sender_handle = record.get("sender_handle")\n            if direction == "outgoing":\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected direction anchor count')
          text = text.replace(old, new, 1)

          old = '''                    direction="outgoing" if is_from_me else "incoming",\n'''
          new = '''                    direction=direction,\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected canonical direction anchor count')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_a0_data_correctness_regressions.py')
          test.write_text('''from datetime import datetime, timezone\nfrom pathlib import Path\nimport sys\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nsys.path.insert(0, str(ROOT / "src"))\n\nfrom analyzazprav.normalization.staging import canonical_direction, iso_utc_to_unix_us\nfrom analyzazprav.a5_ai.integration_a2 import A2SQLiteMessageSource\n\n\nclass DataCorrectnessRegressionTests(unittest.TestCase):\n    def test_unknown_direction_is_not_collapsed_to_incoming(self):\n        self.assertEqual(canonical_direction(None), "unknown")\n        self.assertEqual(canonical_direction(object()), "unknown")\n        self.assertEqual(canonical_direction(True), "outgoing")\n        self.assertEqual(canonical_direction(1), "outgoing")\n        self.assertEqual(canonical_direction(False), "incoming")\n        self.assertEqual(canonical_direction(0), "incoming")\n\n    def test_a2_utc_microseconds_are_exact_without_float(self):\n        self.assertEqual(iso_utc_to_unix_us("2500-01-01T00:00:00.123457Z"), 16_725_225_600_123_457)\n        self.assertEqual(iso_utc_to_unix_us("1969-12-31T23:59:59.999999Z"), -1)\n\n    def test_a5_utc_microseconds_round_trip_exactly(self):\n        value = datetime(2500, 1, 1, 0, 0, 0, 123457, tzinfo=timezone.utc)\n        exact = A2SQLiteMessageSource._to_utc_us(value)\n        self.assertEqual(exact, 16_725_225_600_123_457)\n        self.assertEqual(A2SQLiteMessageSource._from_utc_us(exact), value)\n        self.assertEqual(A2SQLiteMessageSource._to_utc_us(datetime(1969, 12, 31, 23, 59, 59, 999999, tzinfo=timezone.utc)), -1)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Commit patched source and regression tests
        shell: bash
        run: |
          git config user.name 'A0 integration bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/analyzazprav/normalization/staging.py tests/test_a0_data_correctness_regressions.py
          git diff --cached --check
          git commit -m 'fix: preserve unknown direction and exact UTC microseconds'
          git push origin HEAD:agent/a0-data-correctness-hardening
